<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Screening Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<main class="container py-4">
  <header class="mb-4"><h1>AI Resume Screening</h1><p class="text-muted">Decision-support tool: scores are not hiring probabilities or final decisions.</p></header>
  <section class="card p-3 mb-4">
    <form id="screen-form">
      <label class="form-label" for="job_description">Job description</label>
      <textarea class="form-control mb-3" id="job_description" name="job_description" rows="7" required></textarea>
      <label class="form-label" for="resumes">PDF resumes (maximum 20, 10 MB total per file)</label>
      <input class="form-control mb-3" id="resumes" name="resumes" type="file" accept=".pdf,application/pdf" multiple required>
      <button class="btn btn-primary" type="submit">Process resumes</button>
      <span id="status" class="ms-2 text-muted"></span>
    </form>
  </section>
  <section id="summary" class="row g-3 mb-4"></section>
  <section class="card p-3">
    <div class="d-flex justify-content-between"><h2 class="h4">Ranked candidates</h2><a href="/api/candidates.csv" class="btn btn-outline-secondary btn-sm">Export CSV</a></div>
    <div id="results" class="table-responsive"><p class="text-muted">Submit a job description and resumes to begin.</p></div>
  </section>
</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
